spring:
  application:
    name: glucotwin-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/glucotwin}
    username: ${POSTGRES_USER:glucotwin}
    password: ${POSTGRES_PASSWORD:glucotwin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      otlp:
        enabled: ${OTLP_METRICS_ENABLED:false}

glucotwin:
  twin:
    staleness-threshold-minutes: ${TWIN_STALENESS_MINUTES:30}
    stale-check-interval-ms: ${TWIN_STALE_CHECK_INTERVAL_MS:300000}
    cgm-history-max-size: ${CGM_HISTORY_MAX_SIZE:12}
  prediction:
    risk-thresholds:
      low-max: ${RISK_LOW_MAX:0.30}
      moderate-max: ${RISK_MODERATE_MAX:0.60}
      high-max: ${RISK_HIGH_MAX:0.85}
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    internal-token: ${ML_SERVICE_INTERNAL_TOKEN:dev-internal-token}
    connect-timeout-seconds: ${ML_CONNECT_TIMEOUT:2}
    read-timeout-seconds: ${ML_READ_TIMEOUT:8}
  security:
    jwt-public-key: ${JWT_PUBLIC_KEY:}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  data:
    clinical-warning-threshold-mmol: ${CLINICAL_WARNING_THRESHOLD:20.0}

# Phase 13: LLM explanation layer
# The API key must be supplied via environment variable — never hardcoded.
# Set OPENAI_API_KEY in your environment or .env file (not committed to VCS).
spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${AI_EXPLANATION_MODEL:gpt-4o-mini}
          temperature: ${AI_EXPLANATION_TEMPERATURE:0.2}
          max-tokens: ${AI_EXPLANATION_MAX_TOKENS:400}

glucotwin:
  ai:
    explanation:
      enabled: ${AI_EXPLANATION_ENABLED:true}
      timeout-seconds: ${AI_EXPLANATION_TIMEOUT_SECONDS:5}
